
services:
  - type: web
    name: jabir-runner-v3
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: python main.py
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: WEBHOOK_SECRET
        sync: false
      - key: HELIUS_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: openai/gpt-oss-120b
      - key: DB_PATH
        value: /var/data/jabir_runner.db
    disk:
      name: jabir-runner-data
      mountPath: /var/data
      sizeGB: 1
